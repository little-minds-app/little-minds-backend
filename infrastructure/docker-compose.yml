# Little Minds local supporting services (Blueprint §27.2 / DEVX-001).
# Nest API runs on the host (LMP-20); Prisma migrate/seed use DATABASE_URL (LMP-22).
#
# From repo root:
#   docker compose -f infrastructure/docker-compose.yml --env-file .env up -d
# Or: make dev-up

name: little-minds-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: little-minds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-little_minds}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - little_minds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Official docker.io/minio/minio was removed from Docker Hub (2026-09); Quay
  # legacy tags now require auth; AIStor denies S3 without a paid license.
  # bitnamilegacy/minio remains a free, S3-compatible MinIO build for local-first.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: little-minds-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-little-minds-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - little_minds_minio_data:/bitnami/minio/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: little-minds-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - little_minds_mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:8025/api/v1/info",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  little_minds_postgres_data:
  little_minds_minio_data:
  little_minds_mailpit_data:
