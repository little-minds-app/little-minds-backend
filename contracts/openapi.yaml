openapi: 3.0.3
info:
  title: Little Minds Backend API
  description: |
    Authoritative OpenAPI contract for little-minds-backend (ADR-014).
    Paths: health/readiness plus LMP-33 parent session lifecycle (`/v1/auth/*`, `/v1/parent/me`).
    LMP-32 adds structured logging / correlation (not path surface) plus readiness.
    LMP-50 adds ActivitySessionV1 / ActivityEventV1 **components** for versioned
    event contracts. Live `POST /v1/events/batch` is intentionally **not** published
    here — ingest lands in a later Jira task. Authoritative Ajv JSON Schemas live under
    `contracts/schemas/activity/` (`schema_version` 1.0.0, independent of this info.version).
    GSM OTP routes are LMP-34 and are not published here.
  version: 0.4.0
  contact:
    name: Little Minds
servers:
  - url: http://localhost:3000
    description: Local NestJS (default PORT)
tags:
  - name: Health
    description: Unauthenticated liveness and readiness (alert-ready signals; no paid vendors)
  - name: Auth
    description: Parent session lifecycle (ADR-019 / LMP-33)
  - name: Parent
    description: Authenticated parent identity probe
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Process liveness
      description: |
        Returns process liveness JSON. Unauthenticated. Does not probe PostgreSQL
        or other dependencies — use `GET /health/ready` for readiness.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: little-minds-backend
                timestamp: '2026-10-27T12:00:00.000Z'
  /health/ready:
    get:
      operationId: getHealthReady
      tags:
        - Health
      summary: Dependency readiness
      description: |
        Returns readiness JSON for load balancers and operator alert scrapers.
        When `DATABASE_URL` is configured, probes PostgreSQL with a lightweight
        `SELECT 1`. When unset, `checks.database: skipped` is allowed **only**
        for `APP_ENV=development` (local Nest without Compose). Staging and
        production missing `DATABASE_URL` return HTTP 503 with
        `status: not_ready` and `checks.database: down`. Probe failure likewise
        returns 503 (alert-ready signal; no paid monitoring required).
        Schema enums are unchanged (`up` | `down` | `skipped`).
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: ok
                service: little-minds-backend
                timestamp: '2026-10-28T12:00:00.000Z'
                checks:
                  database: skipped
        '503':
          description: Not ready (dependency failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: not_ready
                service: little-minds-backend
                timestamp: '2026-10-28T12:00:00.000Z'
                checks:
                  database: down
  /v1/auth/token/refresh:
    post:
      operationId: refreshParentSession
      tags: [Auth]
      summary: Rotate parent access and refresh tokens
      description: |
        Transactional single-winner refresh (ADR-019). Clients must use single-flight
        refresh and must not retry a consumed refresh token. Lost responses require re-authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Invalid, expired, revoked, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/logout:
    post:
      operationId: logoutParentSession
      tags: [Auth]
      summary: Revoke the current parent session
      description: Requires refresh_token and/or Authorization bearer. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked (or already revoked)
        '400':
          description: Missing refresh and bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/logout-all:
    post:
      operationId: logoutAllParentSessions
      tags: [Auth]
      summary: Revoke all sessions for the authenticated parent
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/sessions:
    get:
      operationId: listParentSessions
      tags: [Auth]
      summary: List sessions for the authenticated parent
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Session summaries (no token material)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentSessionListResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeParentSession
      tags: [Auth]
      summary: Revoke one owned session
      security:
        - parentAccessToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '204':
          description: Revoked (idempotent if already revoked and owned)
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Unknown or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/parent/me:
    get:
      operationId: getParentMe
      tags: [Parent]
      summary: Authenticated parent identity probe
      security:
        - parentAccessToken: []
      responses:
        '200':
          description: Parent account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentMeResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /v1/auth/dev/session:
    post:
      operationId: createDevParentSession
      tags: [Auth]
      summary: Local/test session bootstrap (development only)
      description: |
        Hard-disabled in staging/production. Requires AUTH_DEV_BOOTSTRAP_ENABLED,
        allowlisted parent_id (default seed parent), and loopback client.
        Do not call from staging/production clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevSessionRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '403':
          description: Bootstrap disabled or session limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Parent not allowlisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
components:
  securitySchemes:
    parentAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Parent access JWT (Ed25519 / EdDSA, token_use=access, aud=little-minds-parent, TTL 900s).
        Server always loads parent_sessions by sid so revoke is immediate.
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          description: Liveness indicator
        service:
          type: string
          enum:
            - little-minds-backend
          description: Stable service identifier
        timestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp when the check was produced
    ReadinessStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - not_ready
          description: Readiness indicator (not_ready → HTTP 503)
        service:
          type: string
          enum:
            - little-minds-backend
          description: Stable service identifier
        timestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 timestamp when the check was produced
        checks:
          type: object
          additionalProperties: false
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - up
                - down
                - skipped
              description: |
                PostgreSQL probe result. `skipped` only when APP_ENV=development
                and DATABASE_URL is unset. Staging/production missing DATABASE_URL
                or a failed probe → `down` (forces overall not_ready).
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 16
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 16
    TokenPairResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - session_id
        - parent_id
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [900]
        session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    LogoutAllResponse:
      type: object
      additionalProperties: false
      required: [revoked_session_count]
      properties:
        revoked_session_count:
          type: integer
          minimum: 0
    AuthError:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - expired_token
            - revoked_session
            - refresh_reuse
            - rate_limited
            - session_limit_exceeded
            - bootstrap_disabled
        message:
          type: string
    ParentSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, created_at, expires_at, revoked]
      properties:
        session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        created_at:
          type: string
          format: date-time
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        client_surface:
          type: string
          nullable: true
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          nullable: true
        user_agent_summary:
          type: string
          nullable: true
          maxLength: 128
    ParentSessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ParentSessionSummary'
    ParentMeResponse:
      type: object
      additionalProperties: false
      required: [parent_id, locale, timezone, lifecycle]
      properties:
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        locale:
          type: string
        timezone:
          type: string
        lifecycle:
          type: string
          enum: [active, pending_deletion, deleted]
    DevSessionRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        client_surface:
          type: string
          enum: [ios, android, web, unknown]
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
    ActivitySchemaVersion:
      type: string
      enum:
        - '1.0.0'
      description: |
        Product event/session schema semver. Independent from OpenAPI info.version.
    UuidV4OrV7:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[47][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: RFC 4122 UUID with version nibble 4 or 7
    UtcInstantZ:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
      description: UTC ISO-8601 instant ending in Z
    ConsentScope:
      type: string
      enum:
        - essential_play_events
        - essential_service_telemetry
        - optional_product_analytics
      description: Purpose-specific consent scope (draft placeholders until legal sign-off)
    ActivityEventType:
      type: string
      enum:
        - activity_started
        - activity_attempted
        - activity_hint_used
        - activity_completed
        - activity_abandoned
        - child_mode_foreground_started
        - child_mode_foreground_ended
        - real_world_mission_offered
        - real_world_mission_opened
        - mission_feedback_submitted
        - mentor_card_opened
        - screen_limit_reached
        - content_pack_downloaded
      description: Blueprint §14.1 allowlist
    ActivitySessionConsent:
      type: object
      additionalProperties: false
      required:
        - purpose
        - policy_version
        - consent_scope
        - decision
      properties:
        purpose:
          type: string
          enum:
            - essential_service_telemetry
            - essential_play_events
            - optional_product_analytics
        policy_version:
          type: string
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        decision:
          type: string
          enum:
            - granted
            - denied
            - withdrawn
          description: Client UX evidence only — never treated as server authorization
    ActivitySessionProvenance:
      type: object
      additionalProperties: false
      required:
        - emitter
        - capture_channel
        - clock_trust
      properties:
        emitter:
          type: string
          enum:
            - kids_mode_client
            - parent_dashboard
            - sync_worker
        capture_channel:
          type: string
          enum:
            - offline_queue
            - online_direct
            - replay_backfill
        clock_trust:
          type: string
          enum:
            - monotonic_within_boot
            - wall_clock_only
            - unknown
    ActivityEventProvenance:
      type: object
      additionalProperties: false
      required:
        - emitter
        - actor_scope
        - source
        - clock_trust
      properties:
        emitter:
          type: string
          enum:
            - kids_mode_client
            - parent_dashboard
            - sync_worker
        actor_scope:
          type: string
          enum:
            - child_play
            - parent
        source:
          type: string
          enum:
            - instrumented
            - caregiver_report
        clock_trust:
          type: string
          enum:
            - monotonic_within_boot
            - wall_clock_only
            - unknown
    ActivitySessionV1:
      type: object
      additionalProperties: false
      description: |
        Versioned activity session wire document. Client MUST NOT send child_id or received_at.
        Full validation rules: contracts/schemas/activity/activity-session-v1.schema.json
      required:
        - schema_version
        - play_session_id
        - device_id
        - content_version_id
        - started_at
        - completion_status
        - consent
        - provenance
      properties:
        schema_version:
          $ref: '#/components/schemas/ActivitySchemaVersion'
        play_session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        content_version_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        started_at:
          $ref: '#/components/schemas/UtcInstantZ'
        ended_at:
          $ref: '#/components/schemas/UtcInstantZ'
        monotonic_duration_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        completion_status:
          type: string
          enum:
            - started
            - completed
            - abandoned
            - interrupted
        app_build:
          type: string
        locale:
          type: string
          pattern: '^[a-z]{2}-[A-Z]{2}$'
        consent:
          $ref: '#/components/schemas/ActivitySessionConsent'
        provenance:
          $ref: '#/components/schemas/ActivitySessionProvenance'
    ActivityEventV1:
      type: object
      additionalProperties: false
      description: |
        Versioned activity event envelope (§14.1 + §38.4). Rejects client received_at / child_id.
        Parent-only events omit play_session_id. Per-type payloads enforced by JSON Schema.
        Full validation: contracts/schemas/activity/activity-event-v1.schema.json
      required:
        - schema_version
        - event_id
        - event_type
        - device_id
        - content_version_id
        - occurred_at
        - consent_scope
        - consent_policy_version
        - provenance
        - payload
      properties:
        schema_version:
          $ref: '#/components/schemas/ActivitySchemaVersion'
        event_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        event_type:
          $ref: '#/components/schemas/ActivityEventType'
        play_session_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          description: Required for child_play; omit for parent-only events
        device_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        content_version_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        occurred_at:
          $ref: '#/components/schemas/UtcInstantZ'
        monotonic_duration_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        consent_scope:
          $ref: '#/components/schemas/ConsentScope'
        consent_policy_version:
          type: string
        provenance:
          $ref: '#/components/schemas/ActivityEventProvenance'
        payload:
          type: object
          additionalProperties: true
          description: Typed allowlisted payload per event_type (see JSON Schema)
