name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-checks:
    name: Docs and pointer checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          test -f README.md
          test -f .github/pull_request_template.md
          test -f package.json
          echo "Repository structure verified."

      - name: LMP-19 documentation structure checks
        run: |
          chmod +x scripts/check-lmp19-docs.sh
          ./scripts/check-lmp19-docs.sh

      - name: LMP-28 env and secrets contract checks
        run: |
          chmod +x scripts/check-env-secrets.sh
          ./scripts/check-env-secrets.sh

  nest-ci:
    name: Nest lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage=false

      - name: E2E tests
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build

  contract-checks:
    name: OpenAPI contract validate and generate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 21 (OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI, compatibility, generate clients, drift
        run: |
          chmod +x scripts/check-contracts.sh
          npm run contracts:check

      - name: OpenAPI Jest contract tests
        run: npm test -- --ci --coverage=false test/openapi.contract.spec.ts

  compose-checks:
    name: Docker Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose file and .env.example
        run: |
          chmod +x scripts/check-compose.sh
          ./scripts/check-compose.sh

  prisma-checks:
    name: Prisma migrate, seed, integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: little_minds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d little_minds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/little_minds?schema=public
      # Required by scripts/db-reset-dev.sh safety gate (explicit approval; loopback-only).
      LM_CONFIRM_DB_RESET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed synthetic fixtures
        run: npm run db:seed

      - name: Integrity tests
        run: npm run test:db -- --ci

      - name: Clean remigrate and re-seed
        run: npm run db:reset

      - name: Re-seed idempotency + integrity after reset
        run: npm run test:db -- --ci
