name: LMP-39 One-time Contract Generation
on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 24 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/lmp-39-child-profile-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Generate and commit canonical clients
        run: |
          npm run contracts:generate
          git add -- contracts/generated
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[LMP-39] Regenerate OpenAPI TypeScript and Dart clients"
            git push origin HEAD:feature/lmp-39-child-profile-foundation
          fi
          npm run contracts:check
