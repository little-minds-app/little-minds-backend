name: LMP-38 Sync OpenAPI Generated Clients
on:
  push:
    branches:
      - feature/lmp-41-parent-profile
    paths:
      - 'contracts/openapi.yaml'
      - 'contracts/VERSION'
      - 'contracts/compatibility/**'
      - '.github/workflows/lmp38-sync-generated.yml'
concurrency:
  group: lmp41-contract-generation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refresh exact current feature head
        run: |
          git fetch origin feature/lmp-41-parent-profile
          git checkout -B feature/lmp-41-parent-profile origin/feature/lmp-41-parent-profile
      - name: Generate versioned OpenAPI clients
        run: |
          npm ci
          npm run contracts:generate
      - name: Commit deterministic generated artifacts to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/generated/
          if ! git diff --cached --quiet; then
            git commit -m "[LMP-41] Regenerate parent profile API clients"
            git push origin HEAD:feature/lmp-41-parent-profile
          fi
