name: LMP-38 Sync OpenAPI Generated Clients
on:
  push:
    branches:
      - design/lmp-38-backend-web-session
      - feature/lmp-42-parent-pin
      - feature/lmp-51-ingestion-contract
    paths:
      - 'contracts/openapi.yaml'
      - 'contracts/VERSION'
      - 'contracts/compatibility/**'
      - '.github/workflows/lmp38-sync-generated.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate versioned OpenAPI clients
        run: |
          npm ci
          npm run contracts:generate
      - name: Commit deterministic generated artifacts to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/generated/
          if ! git diff --cached --quiet; then
            git commit -m "[LMP-51] Regenerate versioned OpenAPI clients"
            git push origin HEAD:${{ github.ref_name }}
          fi
